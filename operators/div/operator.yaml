name: div
version: 0.1.0
root: .
default_backend: cuda
paths:
  build_root: build
  dist_root: dist
docs:
  proposal: docs/proposal.md
  spec: docs/spec.md
  tasks: docs/tasks.md
  usage: docs/usage.md
backends:
  cuda:
    status: device_tested
    kernel:
      dir: src/cuda/kernel
      extensions:
      - .cu
      default_file: div_kernel_v1.cu
      cmake_variable: OPS_KERNEL_FILE
      dir_cmake_variable: OPS_KERNEL_DIR
    host:
      dir: src/cuda/host
      extensions:
      - .cu
      default_file: div_host_v1.cu
      cmake_variable: OPS_HOST_FILE
      dir_cmake_variable: OPS_HOST_DIR
    build:
      project: .
      options:
        OPS_ENABLE_CUDA: true
        OPS_ENABLE_CANN: false
      examples_option: OPS_BUILD_EXAMPLES
    tests:
      project: tests/cuda
      test: tests/cuda/test/div_cuda_test.cu
      memory: tests/cuda/test/div_cuda_memory_eval.cu
      bench: tests/cuda/bench/div_cuda_bench.cu
      cmake_variables:
        test: OPS_TEST_CORRECTNESS_SOURCE
        memory: OPS_TEST_MEMORY_SOURCE
        bench: OPS_TEST_BENCH_SOURCE
        memory_results: DIV_CUDA_MEMORY_RESULTS
      options: {}
      results:
        memory: tests/cuda/test/results/memory.csv
        bench: tests/cuda/bench/results
    bench:
      protocol: cuda_tsv_v1
      target: div_cuda_bench
      executable: div_cuda_bench
      compiler: nvcc
      dtype: float32
      sizes:
      - 1024
      - 1048576
      - 16777216
      iterations: 100
      repeats: 5
      max_input: 2147483647
      options:
        OPS_BUILD_BENCH: true
    profile:
      tool: ncu
      size: 65536
      iterations: 1
      launch_skip: 10
      launch_count: 1
      output: build/div/profile/cuda
    demo: examples/cuda/div_demo.cu
    package:
      include_all_sources: true
      include:
      - CMakeLists.txt
      - operator.yaml
      - docs/proposal.md
      - docs/spec.md
      - docs/tasks.md
      - docs/usage.md
      - src/cuda/CMakeLists.txt
      - src/cuda/host/kernel_selection.h.in
      - src/cuda/include/ops/div_cuda.hpp
      - tests/cuda/CMakeLists.txt
      - tests/cuda/test/div_cuda_test.cu
      - tests/cuda/test/div_cuda_memory_eval.cu
      - tests/cuda/bench/div_cuda_bench.cu
      - examples/cuda/div_demo.cu
  cann:
    status: device_tested
    kernel:
      dir: src/cann/kernel
      extensions:
      - .cpp
      - .cc
      - .cxx
      default_file: div_kernel_v1.cpp
      cmake_variable: OPS_KERNEL_FILE
      dir_cmake_variable: OPS_KERNEL_DIR
    host:
      dir: src/cann/host
      extensions:
      - .cpp
      - .cc
      - .cxx
      default_file: div_host_v1.cpp
      cmake_variable: OPS_HOST_FILE
      dir_cmake_variable: OPS_HOST_DIR
    build:
      project: src/cann
      options: {}
      examples_option: OPS_BUILD_EXAMPLES
    tests:
      project: tests/cann
      test: tests/cann/test/div_cann_test.cpp
      memory: tests/cann/test/div_cann_memory_eval.cpp
      bench: tests/cann/bench/div_cann_bench.cpp
      cmake_variables:
        test: OPS_TEST_CORRECTNESS_SOURCE
        memory: OPS_TEST_MEMORY_SOURCE
        bench: OPS_TEST_BENCH_SOURCE
        memory_results: DIV_CANN_MEMORY_RESULTS
      options: {}
      results:
        memory: tests/cann/test/results/memory.csv
        bench: tests/cann/bench/results
    bench:
      protocol: cann_tsv_v1
      target: div_cann_bench
      executable: div_cann_bench
      compiler: bisheng
      dtype: float32
      sizes:
      - 1024
      - 65536
      - 1048576
      iterations: 30
      repeats: 5
      max_input: 2147483647
      options:
        OPS_BUILD_BENCH: true
    profile:
      tool: msprof
      size: 65536
      iterations: 1
      output: build/div/profile/cann
    demo: examples/cann/div_demo.cpp
    package:
      include_all_sources: true
      include:
      - operator.yaml
      - docs/proposal.md
      - docs/spec.md
      - docs/tasks.md
      - docs/usage.md
      - src/cann/CMakeLists.txt
      - src/cann/host/kernel_selection.h.in
      - src/cann/include/ops/div_cann.hpp
      - tests/cann/CMakeLists.txt
      - tests/cann/test/div_cann_test.cpp
      - tests/cann/test/div_cann_memory_eval.cpp
      - tests/cann/bench/div_cann_bench.cpp
      - examples/cann/div_demo.cpp
frameworks:
  pytorch:
    status: device_tested
    implementation: src/pytorch/div_pytorch_v1.py
    entry: run
    rtol: 1.0e-5
    atol: 1.0e-5
    bench:
      sizes: [1024, 1048576, 16777216]
      warmup: 20
      iterations: 100
      repeats: 5
      bytes_per_element: 12
      results: tests/pytorch/bench/results
    profile:
      size: 1048576
      warmup: 5
      steps: 10
      output: build/div/profile/pytorch
  triton:
    status: device_tested
    implementation: src/triton/div_triton_v2.py
    entry: run
    rtol: 1.0e-5
    atol: 1.0e-5
    bench:
      sizes: [1024, 1048576, 16777216]
      warmup: 20
      iterations: 100
      repeats: 5
      bytes_per_element: 12
      results: tests/triton/bench/results
    profile:
      size: 1048576
      warmup: 5
      steps: 10
      output: build/div/profile/triton
